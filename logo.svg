<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="logoPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Text Gradient for "AdPulse" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON (52x52 at x=6, y=6) -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="url(#logoBgGrad)" />
    <rect width="52" height="52" rx="14" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    
    <!-- Stylized T -->
    <path d="M 12 14 C 12 12.8 13 12 14.2 12 L 37.8 12 C 39 12 40 12.8 40 14 L 40 18.5 C 40 19.5 39.2 20.2 38.2 20.2 L 29.5 20.2 L 29.5 39 C 29.5 40.2 28.7 41 27.5 41 L 24.5 41 C 23.3 41 22.5 40.2 22.5 39 L 22.5 20.2 L 13.8 20.2 C 12.8 20.2 12 19.5 12 18.5 Z" fill="#ffffff" />
    
    <!-- AdPulse Wave -->
    <path d="M 10 30 L 18 30 L 22 22 L 27 38 L 32 16 L 35 30 L 42 30" stroke="url(#logoPulseGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    <circle cx="35" cy="16" r="2" fill="#4ade80" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(72, 0)">
    <!-- Brand Wordmark -->
    <text x="0" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5">
      Tactic
    </text>
    <text x="73" y="36" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      AdPulse
    </text>
    
    <!-- Pulse live beacon dot -->
    <circle cx="178" cy="24" r="3.5" fill="#10b981" />
    <circle cx="178" cy="24" r="6" stroke="#10b981" stroke-width="1.2" opacity="0.5" />

    <!-- Tagline -->
    <text x="1" y="50" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="1.2" text-transform="uppercase">
      CPA &amp; Funnel Performance
    </text>
  </g>
</svg>
