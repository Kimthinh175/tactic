<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Inset Shadow effect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Stylized Geometric 'T' -->
  <!-- Top Bar of T -->
  <path d="M 15 17 C 15 15.5 16 14.5 17.5 14.5 L 46.5 14.5 C 48 14.5 49 15.5 49 17 L 49 22.5 C 49 23.5 48 24.5 47 24.5 L 36.5 24.5 L 36.5 48 C 36.5 49.5 35.5 50.5 34 50.5 L 30 50.5 C 28.5 50.5 27.5 49.5 27.5 48 L 27.5 24.5 L 17 24.5 C 16 24.5 15 23.5 15 22.5 Z" fill="#ffffff" />

  <!-- AdPulse ECG / Performance Wave across the T -->
  <path d="M 12 36 L 22 36 L 26 27 L 32 45 L 38 19 L 42 36 L 52 36" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Success Spark Dot -->
  <circle cx="42" cy="19" r="2.5" fill="#4ade80" />
</svg>
